<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLF Trader Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0E14'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%2316C784'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLF Hub">
<meta name="theme-color" content="#0A0E14">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #0A0E14;
    --panel: #131822;
    --panel-soft: #0E131B;
    --border: #232A38;
    --text: #E6E9EF;
    --text-soft: #7C8699;
    --green: #16C784;
    --green-soft: #0F2A22;
    --red: #F6465D;
    --red-soft: #2E1218;
    --gold: #F0B90B;
    --gold-soft: #2E2408;
    --font-display: 'Segoe UI', -apple-system, sans-serif;
    --font-mono: 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(22,199,132,0.07), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(240,185,11,0.05), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-display);
    padding:0 0 90px 0;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:28px 20px 40px; position:relative; z-index:1; }
  .wrap.gated{ display:none; }
  h1,h2,h3{ margin:0; }
  button{ font-family:var(--font-display); font-size:14px; border-radius:9px; padding:11px 18px; cursor:pointer; border:1px solid transparent; font-weight:600; }
  button.primary{ background:var(--green); color:#06120D; border:none; }
  button.primary:hover{ filter:brightness(1.1); }
  button.ghost{ background:none; border:1px solid var(--border); color:var(--text-soft); }
  button.ghost:hover{ border-color:var(--green); color:var(--green); }
  .backbtn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-soft); cursor:pointer; margin-bottom:16px; }
  .backbtn:hover{ color:var(--green); }

  /* header */
  .home-header{ margin-bottom:20px; }
  .home-header h1{ font-size:24px; color:var(--green); letter-spacing:0.3px; }
  .home-header .sub{ font-size:13px; color:var(--text-soft); margin-top:4px; }

  .section-block{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .section-block h4{ font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--gold); margin-bottom:10px; }

  .trader-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .trader-row:hover{ border-color:var(--green); }
  .trader-row .dp-small{ width:42px; height:42px; border-radius:50%; object-fit:cover; background:var(--panel-soft); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .trader-row .tname{ font-size:14px; font-weight:600; }
  .trader-row .tmeta{ font-size:11.5px; color:var(--text-soft); font-family:var(--font-mono); }

  .search-input{ width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:12px 16px; border-radius:10px; font-size:14px; margin-bottom:16px; box-sizing:border-box; }
  .search-input:focus{ outline:none; border-color:var(--green); }

  /* profile */
  .profile-header{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .dp{ width:76px; height:76px; border-radius:50%; object-fit:cover; border:2px solid var(--green); background:var(--panel); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; }
  .dp-upload{ font-size:11px; color:var(--green); cursor:pointer; margin-top:4px; display:inline-block; }
  .profile-name{ font-size:19px; font-weight:700; }
  .profile-username{ font-size:12px; color:var(--text-soft); font-family:var(--font-mono); }
  .follow-stats{ display:flex; gap:20px; margin:6px 0 18px 0; font-size:13px; color:var(--text-soft); }
  .follow-stats span{ cursor:pointer; }
  .follow-stats span:hover{ color:var(--green); }
  .follow-stats strong{ color:var(--text); }
  .follow-btn{ margin-top:6px; }
  .bio-box{ width:100%; background:var(--panel-soft); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:8px; font-family:var(--font-display); font-size:13px; margin-bottom:10px; box-sizing:border-box; min-height:60px; }

  .trade-stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .stat-card{ flex:1; min-width:120px; background:var(--panel-soft); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .stat-card .lbl{ font-size:10.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; }
  .stat-card .val{ font-family:var(--font-mono); font-size:16px; font-weight:bold; color:var(--gold); }

  input[type="text"], input[type="password"], input[type="number"], input[type="date"], select{
    width:100%; background:var(--panel-soft); border:1px solid var(--border); color:var(--text);
    padding:11px 13px; border-radius:9px; font-family:var(--font-display); font-size:13.5px; margin-bottom:12px; box-sizing:border-box;
  }
  input:focus, select:focus{ outline:none; border-color:var(--green); }
  label{ display:block; font-size:11.5px; color:var(--text-soft); margin-bottom:5px; }

  /* access gate */
  #accessGate{ position:fixed; inset:0; z-index:9999; background: radial-gradient(circle at 20% 15%, rgba(22,199,132,0.10), transparent 45%), var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; }
  #accessGate.hidden{ display:none; }
  .gate-box{ background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:32px 26px; max-width:360px; width:100%; }
  .gate-emoji{ font-size:36px; margin-bottom:8px; }
  .gate-title{ font-family:var(--font-display); font-weight:800; font-size:22px; color:var(--green); margin-bottom:6px; letter-spacing:0.5px; }
  .gate-sub{ font-size:12px; color:var(--text-soft); margin-bottom:20px; }
  .gate-tabs{ display:flex; gap:6px; margin-bottom:16px; background:var(--panel-soft); border-radius:10px; padding:4px; }
  .gate-tab{ flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--text-soft); }
  .gate-tab.active{ background:var(--green); color:#06120D; font-weight:700; }
  .gate-error{ color:var(--red); font-size:12px; margin-top:10px; min-height:16px; }

  /* modals */
  .modal-overlay{ position:fixed; inset:0; z-index:5000; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.hidden{ display:none; }
  #imgModal img{ max-width:90vw; max-height:80vh; border-radius:12px; }
  .list-modal-box{ background:var(--panel); border-radius:16px; padding:18px; max-width:360px; width:100%; max-height:70vh; overflow-y:auto; }
  .list-modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .list-modal-close{ cursor:pointer; color:var(--text-soft); font-size:18px; }

  /* bottom nav */
  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:2000; background:var(--panel); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)) 4px; }
  .bottom-nav.gated{ display:none; }
  .bn-item{ display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text-soft); cursor:pointer; font-size:10px; flex:1; padding:4px 0; }
  .bn-icon{ font-size:19px; }
  .bn-item.active{ color:var(--green); }
</style>
</head>
<body>

<div id="accessGate">
  <div class="gate-box">
    <div class="gate-emoji">⚡</div>
    <div class="gate-title">SLF TRADER HUB</div>
    <div class="gate-sub">Private community for funded traders</div>
    <div class="gate-tabs">
      <div class="gate-tab active" id="tabLogin">Login</div>
      <div class="gate-tab" id="tabSignup">Sign Up</div>
    </div>
    <div id="signupOnlyField">
      <input type="text" id="gateCode" placeholder="ACCESS CODE" maxlength="20">
    </div>
    <input type="text" id="gateUsername" placeholder="Username" maxlength="20">
    <input type="password" id="gatePassword" placeholder="Password" maxlength="30">
    <button class="primary" id="gateBtn" style="width:100%;">Login</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="wrap gated" id="app"></div>

<div class="modal-overlay hidden" id="imgModal"><img id="imgModalPic" src=""></div>
<div class="modal-overlay hidden" id="listModal">
  <div class="list-modal-box">
    <div class="list-modal-head"><h3 id="listModalTitle">Followers</h3><span class="list-modal-close" id="listModalClose">✕</span></div>
    <div id="listModalBody"></div>
  </div>
</div>

<div class="bottom-nav gated" id="bottomNav">
  <div class="bn-item active" data-nav="home"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></div>
  <div class="bn-item" data-nav="search"><span class="bn-icon">🔍</span><span class="bn-label">Traders</span></div>
  <div class="bn-item" data-nav="profile"><span class="bn-icon">👤</span><span class="bn-label">Profile</span></div>
</div>

<script>
/* ================= STATE ================= */
let currentUser = null;
let profile = { username:"", bio:"", photoBase64:null, following:[], followers:[], accountSize:null, accountType:"", startDate:"" };
let allTradersCache = null;

const ACCOUNT_TYPES = ["1 Step Challenge", "2 Step Challenge", "Instant Funding"];

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAPEgEmcs7_upeLU6vvaDmegRaQ0JqX9IE",
  authDomain: "slf-trader-hub.firebaseapp.com",
  projectId: "slf-trader-hub",
  storageBucket: "slf-trader-hub.firebasestorage.app",
  messagingSenderId: "77368939885",
  appId: "1:77368939885:web:4378e56d208bbc1fd67664"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ================= DATA HELPERS ================= */
async function loadProfile(){
  if(!currentUser) return;
  try{
    const snap = await db.collection("traders").doc(currentUser.uid).get();
    if(snap.exists){
      const d = snap.data();
      profile = {
        username: d.username||"", bio: d.bio||"", photoBase64: d.photoBase64||null,
        following: d.following||[], followers: d.followers||[],
        accountSize: d.accountSize||null, accountType: d.accountType||"", startDate: d.startDate||""
      };
    }
  }catch(e){}
}
async function saveProfileFields(fields){
  if(!currentUser) return;
  Object.assign(profile, fields);
  try{ await db.collection("traders").doc(currentUser.uid).update(fields); }catch(e){}
}
async function toggleFollow(targetUid, isFollowing){
  const batch = db.batch();
  const meRef = db.collection("traders").doc(currentUser.uid);
  const themRef = db.collection("traders").doc(targetUid);
  if(isFollowing){
    batch.update(meRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
    batch.update(themRef, { followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
    profile.following = profile.following.filter(u => u !== targetUid);
  } else {
    batch.update(meRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
    batch.update(themRef, { followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
    profile.following.push(targetUid);
  }
  await batch.commit();
}
async function getTraderByUid(uid){
  if(allTradersCache){ const f = allTradersCache.find(u => u.uid === uid); if(f) return f; }
  try{ const snap = await db.collection("traders").doc(uid).get(); if(snap.exists) return { uid, ...snap.data() }; }catch(e){}
  return null;
}

/* ================= ROUTER ================= */
const app = document.getElementById("app");
function nav(view, payload){
  updateBottomNavActive(view);
  if(view==="home") renderHome();
  else if(view==="search") renderSearch();
  else if(view==="profile") renderProfile();
  else if(view==="publicProfile") renderPublicProfile(payload);
}
function updateBottomNavActive(view){
  document.querySelectorAll(".bn-item").forEach(el => el.classList.toggle("active", el.dataset.nav === view));
}
document.querySelectorAll(".bn-item").forEach(el => el.addEventListener("click", () => nav(el.dataset.nav)));

/* ================= HOME ================= */
async function renderHome(){
  app.innerHTML = `
    <div class="home-header">
      <h1>⚡ SLF TRADER HUB</h1>
      <div class="sub">Welcome back, ${profile.username}</div>
    </div>
    <div class="section-block">
      <h4>Your Account</h4>
      <div class="trade-stats">
        <div class="stat-card"><div class="lbl">Account Size</div><div class="val">${profile.accountSize ? "$"+profile.accountSize : "—"}</div></div>
        <div class="stat-card"><div class="lbl">Type</div><div class="val" style="font-size:13px;">${profile.accountType || "—"}</div></div>
        <div class="stat-card"><div class="lbl">Start Date</div><div class="val" style="font-size:13px;">${profile.startDate || "—"}</div></div>
      </div>
      ${(!profile.accountSize || !profile.accountType) ? `<p style="font-size:12px; color:var(--text-soft); margin-top:8px;">Apni profile me account details set karo taaki doston ko dikh sake.</p>` : ""}
    </div>

    <div class="index-head" style="font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">People You Follow</div>
    <div id="followingList"><p style="color:var(--text-soft); font-size:13px;">Loading…</p></div>
  `;
  const listEl = document.getElementById("followingList");
  if(!profile.following || profile.following.length === 0){
    listEl.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Abhi kisi ko follow nahi kiya. 🔍 Traders tab se apne doston ko dhoondo.</p>`;
    return;
  }
  const traders = await Promise.all(profile.following.map(uid => getTraderByUid(uid)));
  listEl.innerHTML = "";
  traders.filter(Boolean).forEach(t => {
    const row = document.createElement("div");
    row.className = "trader-row";
    row.innerHTML = `
      <div class="dp-small">${t.photoBase64 ? `<img src="${t.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
      <div>
        <div class="tname">${t.username}</div>
        <div class="tmeta">${t.accountType || "—"} ${t.accountSize ? "· $"+t.accountSize : ""}</div>
      </div>
    `;
    row.addEventListener("click", () => nav("publicProfile", t.uid));
    listEl.appendChild(row);
  });
}

/* ================= SEARCH ================= */
async function renderSearch(){
  app.innerHTML = `
    <h2 style="margin-bottom:14px;">🔍 Find Traders</h2>
    <input type="text" class="search-input" id="searchInput" placeholder="Search by username...">
    <div id="searchResults"></div>
  `;
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  input.focus();
  if(!allTradersCache){
    try{
      const snap = await db.collection("traders").get();
      allTradersCache = [];
      snap.forEach(doc => allTradersCache.push({ uid: doc.id, ...doc.data() }));
    }catch(e){ allTradersCache = []; }
  }
  let debounceTimer = null;
  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const q = input.value.trim().toLowerCase();
      results.innerHTML = "";
      if(!q) return;
      const matches = allTradersCache.filter(u => u.uid !== currentUser.uid && (u.username||"").toLowerCase().includes(q));
      if(matches.length === 0){ results.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Koi nahi mila.</p>`; return; }
      matches.slice(0,20).forEach(u => {
        const row = document.createElement("div");
        row.className = "trader-row";
        row.innerHTML = `
          <div class="dp-small">${u.photoBase64 ? `<img src="${u.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
          <div><div class="tname">${u.username}</div><div class="tmeta">${u.accountType||"—"}</div></div>
        `;
        row.addEventListener("click", () => nav("publicProfile", u.uid));
        results.appendChild(row);
      });
    }, 250);
  });
}

/* ================= OWN PROFILE ================= */
function renderProfile(){
  app.innerHTML = `
    <div class="profile-header">
      <div class="dp" id="dpBox">${profile.photoBase64 ? `<img src="${profile.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
      <div>
        <div class="profile-name">${profile.username}</div>
        <div class="profile-username">@${profile.username}</div>
        <label class="dp-upload" for="dpUpload">Change photo</label>
        <input type="file" id="dpUpload" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="follow-stats">
      <span id="followersStat"><strong>${(profile.followers||[]).length}</strong> Followers</span>
      <span id="followingStat"><strong>${(profile.following||[]).length}</strong> Following</span>
    </div>

    <div class="section-block">
      <h4>Trading Account</h4>
      <label>Account Size ($)</label>
      <input type="number" id="accSize" value="${profile.accountSize||''}" placeholder="e.g. 50000">
      <label>Account Type</label>
      <select id="accType">
        <option value="">Select type</option>
        ${ACCOUNT_TYPES.map(t => `<option value="${t}" ${profile.accountType===t?'selected':''}>${t}</option>`).join("")}
      </select>
      <label>Challenge Start Date</label>
      <input type="date" id="accStartDate" value="${profile.startDate||''}">
      <button class="primary" id="saveAccBtn">Save Account Info</button>
      <span id="accMsg" style="font-size:11px;color:var(--green);margin-left:8px;"></span>
    </div>

    <div class="section-block">
      <h4>Bio</h4>
      <textarea class="bio-box" id="bioInput" placeholder="Kuch likho apne baare me...">${profile.bio||""}</textarea>
      <button class="primary" id="saveBioBtn">Save Bio</button>
      <span id="bioMsg" style="font-size:11px;color:var(--green);margin-left:8px;"></span>
    </div>

    <button class="ghost" id="logoutBtn" style="width:100%;">Logout</button>
  `;
  attachLongPress(document.getElementById("dpBox"), () => showImageModal(profile.photoBase64));
  document.getElementById("followersStat").addEventListener("click", () => showFollowListModal(profile.followers, "Followers"));
  document.getElementById("followingStat").addEventListener("click", () => showFollowListModal(profile.following, "Following"));
  document.getElementById("saveAccBtn").addEventListener("click", async () => {
    await saveProfileFields({
      accountSize: parseFloat(document.getElementById("accSize").value) || null,
      accountType: document.getElementById("accType").value,
      startDate: document.getElementById("accStartDate").value
    });
    document.getElementById("accMsg").textContent = "Saved ✓";
    setTimeout(()=>{ document.getElementById("accMsg").textContent=""; }, 1500);
  });
  document.getElementById("saveBioBtn").addEventListener("click", async () => {
    await saveProfileFields({ bio: document.getElementById("bioInput").value.trim() });
    document.getElementById("bioMsg").textContent = "Saved ✓";
    setTimeout(()=>{ document.getElementById("bioMsg").textContent=""; }, 1500);
  });
  document.getElementById("dpUpload").addEventListener("change", (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement("canvas");
        const size = 160; canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        await saveProfileFields({ photoBase64: canvas.toDataURL("image/jpeg", 0.6) });
        renderProfile();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());
}

/* ================= PUBLIC PROFILE ================= */
async function renderPublicProfile(uid){
  app.innerHTML = `<div class="backbtn" id="backBtn">← Back</div><p style="color:var(--text-soft);">Loading…</p>`;
  document.getElementById("backBtn").addEventListener("click", () => nav("home"));
  let snap;
  try{ snap = await db.collection("traders").doc(uid).get(); }catch(e){}
  if(!snap || !snap.exists){ app.innerHTML = `<div class="backbtn" id="backBtn">← Back</div><p>Trader nahi mila.</p>`; document.getElementById("backBtn").addEventListener("click", () => nav("home")); return; }
  const u = snap.data();
  const isFollowing = (profile.following||[]).includes(uid);
  app.innerHTML = `
    <div class="backbtn" id="backBtn">← Back</div>
    <div class="profile-header">
      <div class="dp" id="dpBoxPublic">${u.photoBase64 ? `<img src="${u.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
      <div>
        <div class="profile-name">${u.username}</div>
        <div class="profile-username">@${u.username}</div>
        <button class="primary follow-btn" id="followBtn">${isFollowing ? "Following ✓" : "+ Follow"}</button>
      </div>
    </div>
    <div class="follow-stats">
      <span id="followersStatPublic"><strong>${(u.followers||[]).length}</strong> Followers</span>
      <span id="followingStatPublic"><strong>${(u.following||[]).length}</strong> Following</span>
    </div>
    <div class="section-block">
      <h4>Trading Account</h4>
      <div class="trade-stats">
        <div class="stat-card"><div class="lbl">Account Size</div><div class="val">${u.accountSize ? "$"+u.accountSize : "—"}</div></div>
        <div class="stat-card"><div class="lbl">Type</div><div class="val" style="font-size:13px;">${u.accountType || "—"}</div></div>
        <div class="stat-card"><div class="lbl">Start Date</div><div class="val" style="font-size:13px;">${u.startDate || "—"}</div></div>
      </div>
    </div>
    ${u.bio ? `<div class="section-block"><h4>Bio</h4><p style="font-size:13.5px;">${u.bio}</p></div>` : ""}
  `;
  document.getElementById("backBtn").addEventListener("click", () => nav("home"));
  attachLongPress(document.getElementById("dpBoxPublic"), () => showImageModal(u.photoBase64));
  document.getElementById("followersStatPublic").addEventListener("click", () => showFollowListModal(u.followers, "Followers"));
  document.getElementById("followingStatPublic").addEventListener("click", () => showFollowListModal(u.following, "Following"));
  document.getElementById("followBtn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    const currentlyFollowing = (profile.following||[]).includes(uid);
    await toggleFollow(uid, currentlyFollowing);
    renderPublicProfile(uid);
  });
}

/* ================= IMAGE MODAL + LONG PRESS ================= */
function showImageModal(base64){
  if(!base64) return;
  document.getElementById("imgModalPic").src = base64;
  document.getElementById("imgModal").classList.remove("hidden");
}
document.getElementById("imgModal").addEventListener("click", () => document.getElementById("imgModal").classList.add("hidden"));
function attachLongPress(el, cb){
  if(!el) return;
  let timer = null;
  el.addEventListener("pointerdown", () => { timer = setTimeout(cb, 450); });
  el.addEventListener("pointerup", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => clearTimeout(timer));
  el.addEventListener("pointercancel", () => clearTimeout(timer));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

/* ================= FOLLOW LIST MODAL ================= */
async function showFollowListModal(uids, title){
  document.getElementById("listModalTitle").textContent = title;
  const body = document.getElementById("listModalBody");
  body.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Loading…</p>`;
  document.getElementById("listModal").classList.remove("hidden");
  if(!uids || uids.length === 0){ body.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Koi nahi hai yahan abhi.</p>`; return; }
  const users = await Promise.all(uids.map(uid => getTraderByUid(uid)));
  body.innerHTML = "";
  users.filter(Boolean).forEach(u => {
    const row = document.createElement("div");
    row.className = "trader-row";
    row.innerHTML = `
      <div class="dp-small">${u.photoBase64 ? `<img src="${u.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
      <div><div class="tname">${u.username}</div></div>
    `;
    row.addEventListener("click", () => { document.getElementById("listModal").classList.add("hidden"); nav("publicProfile", u.uid); });
    body.appendChild(row);
  });
}
document.getElementById("listModalClose").addEventListener("click", () => document.getElementById("listModal").classList.add("hidden"));
document.getElementById("listModal").addEventListener("click", (e) => { if(e.target.id === "listModal") document.getElementById("listModal").classList.add("hidden"); });

/* ================= AUTH ================= */
let gateMode = "login";
function pseudoEmail(username){ return username.toLowerCase().replace(/[^a-z0-9_]/g,"") + "@slfhub.local"; }
function gateError(msg){ document.getElementById("gateError").textContent = msg; }
function setGateMode(mode){
  gateMode = mode;
  document.getElementById("tabLogin").classList.toggle("active", mode==="login");
  document.getElementById("tabSignup").classList.toggle("active", mode==="signup");
  document.getElementById("signupOnlyField").style.display = mode==="signup" ? "block" : "none";
  document.getElementById("gateBtn").textContent = mode==="signup" ? "Create Account" : "Login";
  gateError("");
}
document.getElementById("tabLogin").addEventListener("click", () => setGateMode("login"));
document.getElementById("tabSignup").addEventListener("click", () => setGateMode("signup"));

async function showAppAfterAuth(user){
  currentUser = user;
  await loadProfile();
  document.getElementById("accessGate").classList.add("hidden");
  document.getElementById("app").classList.remove("gated");
  document.getElementById("bottomNav").classList.remove("gated");
  nav("home");
}

async function handleGateSubmit(){
  const username = document.getElementById("gateUsername").value.trim();
  const password = document.getElementById("gatePassword").value;
  const btn = document.getElementById("gateBtn");
  if(!username || !password){ gateError("Username aur password dono bharo."); return; }
  btn.disabled = true;
  gateError("Please wait…");
  if(gateMode === "signup"){
    const code = document.getElementById("gateCode").value.trim().toUpperCase();
    if(!code){ gateError("Access code bharo."); btn.disabled=false; return; }
    try{
      const codeRef = db.collection("codes").doc(code);
      const codeSnap = await codeRef.get();
      if(!codeSnap.exists){ gateError("❌ Ye access code valid nahi hai."); btn.disabled=false; return; }
      if(codeSnap.data().used === true){ gateError("❌ Ye code already use ho chuka hai."); btn.disabled=false; return; }
      const cred = await auth.createUserWithEmailAndPassword(pseudoEmail(username), password);
      await db.collection("traders").doc(cred.user.uid).set({
        username, bio:"", photoBase64:null,
        following:[], followers:[],
        accountSize:null, accountType:"", startDate:"",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await codeRef.update({ used:true, usedBy: cred.user.uid, usedAt: firebase.firestore.FieldValue.serverTimestamp() });
      await showAppAfterAuth(cred.user);
    }catch(e){
      if(e.code === "auth/email-already-in-use") gateError("❌ Ye username pehle se liya gaya hai.");
      else if(e.code === "auth/weak-password") gateError("❌ Password kam se kam 6 characters ka rakho.");
      else gateError("❌ " + e.message);
      btn.disabled = false;
    }
  } else {
    try{
      const cred = await auth.signInWithEmailAndPassword(pseudoEmail(username), password);
      await showAppAfterAuth(cred.user);
    }catch(e){
      gateError("❌ Galat username ya password.");
      btn.disabled = false;
    }
  }
}
document.getElementById("gateBtn").addEventListener("click", handleGateSubmit);
document.getElementById("gatePassword").addEventListener("keydown", (e) => { if(e.key==="Enter") handleGateSubmit(); });

auth.onAuthStateChanged((user) => {
  if(user){ showAppAfterAuth(user); }
  else{
    currentUser = null;
    document.getElementById("accessGate").classList.remove("hidden");
    document.getElementById("app").classList.add("gated");
    document.getElementById("bottomNav").classList.add("gated");
  }
});
</script>
