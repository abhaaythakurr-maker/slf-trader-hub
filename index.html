<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLF Trader Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0E14'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%2316C784'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLF Hub">
<meta name="theme-color" content="#0A0E14">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #05070A;
    --panel: rgba(20,26,36,0.68);
    --panel-solid: #0D121B;
    --panel-soft: rgba(13,18,27,0.85);
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #F3F5F9;
    --text-soft: #7C879B;
    --green: #17E6A1;
    --green-dim: #0FB37D;
    --green-soft: rgba(23,230,161,0.10);
    --red: #FF4D6A;
    --red-soft: rgba(255,77,106,0.10);
    --gold: #FFC53D;
    --gold-soft: rgba(255,197,61,0.10);
    --purple: #9B6BFF;
    --font-display: 'Segoe UI', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --rail-w: 72px;
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 0%, rgba(23,230,161,0.10), transparent 42%),
      radial-gradient(circle at 100% 100%, rgba(255,197,61,0.07), transparent 45%),
      radial-gradient(circle at 60% 40%, rgba(155,107,255,0.05), transparent 50%),
      linear-gradient(180deg, #05070A 0%, #060A0F 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-display);
    padding:0;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:34px 34px;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:30px 22px 60px calc(var(--rail-w) + 26px); position:relative; z-index:1; }
  .wrap.gated{ display:none; }
  h1,h2,h3{ margin:0; letter-spacing:-0.2px; }
  ::selection{ background:var(--green); color:#04120C; }
  button{ font-family:var(--font-display); font-size:13.5px; border-radius:10px; padding:12px 20px; cursor:pointer; border:1px solid transparent; font-weight:700; letter-spacing:0.2px; transition:all 0.15s ease; }
  button.primary{ background:linear-gradient(135deg, var(--green), var(--green-dim)); color:#04140D; border:none; box-shadow:0 4px 18px rgba(23,230,161,0.25); }
  button.primary:hover{ filter:brightness(1.08); box-shadow:0 6px 22px rgba(23,230,161,0.4); transform:translateY(-1px); }
  button.ghost{ background:rgba(255,255,255,0.02); border:1px solid var(--border-strong); color:var(--text-soft); }
  button.ghost:hover{ border-color:var(--green); color:var(--green); }
  .backbtn{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-soft); cursor:pointer; margin-bottom:18px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
  .backbtn:hover{ color:var(--green); }

  /* header */
  .home-header{ margin-bottom:22px; }
  .home-header h1{ font-size:26px; font-weight:800; letter-spacing:-0.5px; background:linear-gradient(135deg, var(--text), var(--green)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .home-header .sub{ font-size:13px; color:var(--text-soft); margin-top:5px; }

  .section-block{
    background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin-bottom:18px;
    box-shadow:0 10px 34px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .section-block h4{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin-bottom:12px; font-weight:800; }

  .trader-row{
    display:flex; align-items:center; gap:12px; background:var(--panel); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:14px; padding:13px 16px; margin-bottom:8px; cursor:pointer;
    transition:all 0.15s ease;
  }
  .trader-row:hover{ border-color:var(--green); box-shadow:0 0 0 1px var(--green-soft), 0 8px 24px rgba(0,0,0,0.3); transform:translateY(-1px); }
  .trader-row .dp-small{ width:44px; height:44px; border-radius:12px; object-fit:cover; background:var(--panel-solid); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; border:1px solid var(--border); }
  .trader-row .tname{ font-size:14px; font-weight:700; }
  .trader-row .tmeta{ font-size:11px; color:var(--text-soft); font-family:var(--font-mono); }

  .search-input{ width:100%; background:var(--panel-soft); backdrop-filter:blur(10px); border:1px solid var(--border-strong); color:var(--text); padding:14px 18px; border-radius:12px; font-size:14px; margin-bottom:18px; box-sizing:border-box; }
  .search-input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }

  /* profile */
  .profile-header{ display:flex; align-items:center; gap:18px; margin-bottom:14px; }
  .dp{ width:80px; height:80px; border-radius:20px; object-fit:cover; border:1px solid var(--border-strong); background:var(--panel-solid); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; box-shadow:0 0 0 3px rgba(23,230,161,0.12), 0 8px 24px rgba(0,0,0,0.4); }
  .dp-upload{ font-size:11px; color:var(--green); cursor:pointer; margin-top:6px; display:inline-block; font-weight:600; }
  .profile-name{ font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  .profile-username{ font-size:12px; color:var(--text-soft); font-family:var(--font-mono); }
  .follow-stats{ display:flex; gap:22px; margin:8px 0 18px 0; font-size:13px; color:var(--text-soft); }
  .follow-stats span{ cursor:pointer; }
  .follow-stats span:hover{ color:var(--green); }
  .follow-stats strong{ color:var(--text); font-weight:800; }
  .follow-btn{ margin-top:8px; }
  .bio-box{ width:100%; background:var(--panel-soft); border:1px solid var(--border-strong); color:var(--text); padding:12px; border-radius:10px; font-family:var(--font-display); font-size:13px; margin-bottom:10px; box-sizing:border-box; min-height:64px; }

  .trade-stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .stat-card{ flex:1; min-width:130px; background:var(--panel-soft); border:1px solid var(--border-strong); border-radius:12px; padding:14px 16px; }
  .stat-card .lbl{ font-size:10px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px; font-weight:700; }
  .stat-card .val{ font-family:var(--font-mono); font-size:17px; font-weight:800; color:var(--gold); text-shadow:0 0 20px rgba(255,197,61,0.25); }

  input[type="text"], input[type="password"], input[type="number"], input[type="date"], select{
    width:100%; background:var(--panel-soft); border:1px solid var(--border-strong); color:var(--text);
    padding:13px 15px; border-radius:11px; font-family:var(--font-display); font-size:13.5px; margin-bottom:12px; box-sizing:border-box;
  }
  input:focus, select:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  label{ display:block; font-size:11px; color:var(--text-soft); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }

  /* access gate */
  #accessGate{ position:fixed; inset:0; z-index:9999; background:
      radial-gradient(circle at 20% 15%, rgba(23,230,161,0.14), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(155,107,255,0.08), transparent 45%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; }
  #accessGate.hidden{ display:none; }
  .gate-box{ background:var(--panel); backdrop-filter:blur(24px); border:1px solid var(--border-strong); border-radius:22px; padding:36px 28px; max-width:370px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .gate-emoji{ font-size:38px; margin-bottom:10px; filter:drop-shadow(0 0 16px rgba(23,230,161,0.5)); }
  .gate-title{ font-family:var(--font-display); font-weight:900; font-size:23px; letter-spacing:0.5px; margin-bottom:6px;
    background:linear-gradient(135deg, var(--green), var(--gold)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .gate-sub{ font-size:12px; color:var(--text-soft); margin-bottom:22px; }
  .gate-tabs{ display:flex; gap:6px; margin-bottom:18px; background:var(--panel-soft); border-radius:12px; padding:4px; border:1px solid var(--border); }
  .gate-tab{ flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13px; cursor:pointer; color:var(--text-soft); font-weight:600; }
  .gate-tab.active{ background:linear-gradient(135deg, var(--green), var(--green-dim)); color:#04140D; font-weight:800; }
  .gate-error{ color:var(--red); font-size:12px; margin-top:10px; min-height:16px; }

  /* modals */
  .modal-overlay{ position:fixed; inset:0; z-index:5000; background:rgba(2,4,7,0.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.hidden{ display:none; }
  #imgModal img{ max-width:90vw; max-height:80vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
  .list-modal-box{ background:var(--panel-solid); border:1px solid var(--border-strong); border-radius:18px; padding:20px; max-width:370px; width:100%; max-height:70vh; overflow-y:auto; }
  .list-modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .list-modal-close{ cursor:pointer; color:var(--text-soft); font-size:18px; }

  /* side nav rail */
  .nav-rail{
    position:fixed; left:0; top:0; bottom:0; width:var(--rail-w); z-index:2000;
    background:var(--panel-solid); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:22px 0;
    gap:6px;
  }
  .nav-rail.gated{ display:none; }
  .nav-rail .rail-logo{ font-size:22px; margin-bottom:18px; filter:drop-shadow(0 0 12px rgba(23,230,161,0.5)); }
  .rail-item{
    width:52px; height:52px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-soft); cursor:pointer; gap:2px; position:relative; transition:all 0.15s ease;
  }
  .rail-item svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .rail-item .rail-lbl{ font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
  .rail-item:hover{ color:var(--text); background:rgba(255,255,255,0.04); }
  .rail-item.active{ color:var(--green); background:var(--green-soft); }
  .rail-item.active::before{
    content:""; position:absolute; left:-11px; top:50%; transform:translateY(-50%);
    width:3px; height:22px; border-radius:3px; background:var(--green); box-shadow:0 0 10px var(--green);
  }

  .rms-tabs{ display:flex; gap:6px; margin-bottom:20px; background:var(--panel); backdrop-filter:blur(14px); border-radius:12px; padding:4px; border:1px solid var(--border); }
  .rms-tab{ flex:1; text-align:center; padding:10px; border-radius:10px; font-size:13px; cursor:pointer; color:var(--text-soft); font-weight:600; }
  .rms-tab.active{ background:linear-gradient(135deg, var(--green), var(--green-dim)); color:#04140D; font-weight:800; }
  .rms-output{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  .rms-output .out-card{ background:var(--panel-soft); border:1px solid var(--border-strong); border-radius:14px; padding:16px; }
  .rms-output .out-card.danger{ border-color:var(--red); box-shadow:0 0 0 1px var(--red-soft); }
  .rms-output .out-card.warn{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-soft); }
  .rms-output .out-card .lbl{ font-size:10px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:7px; font-weight:700; }
  .rms-output .out-card .val{ font-family:var(--font-mono); font-size:20px; font-weight:800; color:var(--green); text-shadow:0 0 20px rgba(23,230,161,0.3); }
  .rms-output .out-card.danger .val{ color:var(--red); text-shadow:0 0 20px rgba(255,77,106,0.3); }
  .rms-output .out-card.warn .val{ color:var(--gold); text-shadow:0 0 20px rgba(255,197,61,0.3); }
  .rms-output .out-card .sub{ font-size:11px; color:var(--text-soft); margin-top:5px; }
  .breach-banner{ background:var(--red-soft); border:1px solid var(--red); color:var(--red); border-radius:12px; padding:14px 16px; margin-top:16px; font-size:13px; font-weight:600; }
  .rules-list{ list-style:none; padding:0; margin:0; }
  .rules-list li{ background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:9px; font-size:13.5px; line-height:1.55; }
  .rules-list li b{ color:var(--gold); }
  .rms-disclaimer{ font-size:11px; color:var(--text-soft); margin-top:18px; padding:12px 14px; background:var(--panel-soft); border-radius:10px; border:1px dashed var(--border-strong); }

  .tracker-hub-card{
    background:var(--panel); backdrop-filter:blur(18px); border:1px solid var(--border); border-radius:16px;
    padding:20px 22px; margin-bottom:14px; cursor:pointer; display:flex; align-items:center; gap:16px;
    transition:all 0.15s ease;
  }
  .tracker-hub-card:hover{ border-color:var(--green); transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,0.35); }
  .tracker-hub-card .thc-icon{ font-size:26px; width:52px; height:52px; border-radius:14px; background:var(--panel-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tracker-hub-card .thc-name{ font-size:15px; font-weight:800; }
  .tracker-hub-card .thc-pct{ font-family:var(--font-mono); font-size:12px; color:var(--green); margin-top:2px; }

  .tracker-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .tracker-head h4{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin:0; font-weight:800; }
  .tracker-pct{ font-family:var(--font-mono); font-size:12px; color:var(--green); font-weight:700; }
  .tracker-item{
    display:flex; align-items:center; gap:12px; background:var(--panel); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:12px; padding:13px 16px; margin-bottom:7px;
  }
  .tracker-item.done{ border-color:var(--green); background:var(--green-soft); }
  .tracker-item span.item-text{ flex:1; font-size:13.5px; font-weight:500; }
  .tracker-item.done span.item-text{ color:var(--green); text-decoration:line-through; text-decoration-color:rgba(23,230,161,0.5); }
  .tracker-item input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--green); cursor:pointer; flex-shrink:0; order:2; }
  .tracker-item .del-x{ color:var(--text-soft); cursor:pointer; font-size:14px; flex-shrink:0; order:3; }
  .tracker-item .del-x:hover{ color:var(--red); }
  .add-item-row{ display:flex; gap:8px; margin-top:10px; }
  .add-item-row input{ flex:1; margin-bottom:0; }
  .add-item-row button{ flex-shrink:0; padding:12px 18px; }
  .history-strip{ display:flex; gap:6px; margin-bottom:26px; }
  .history-day{ flex:1; text-align:center; }
  .history-day .bar{ height:54px; border-radius:8px; background:var(--panel-soft); border:1px solid var(--border-strong); display:flex; align-items:flex-end; overflow:hidden; }
  .history-day .bar-fill{ width:100%; background:linear-gradient(180deg, var(--green), var(--green-dim)); }
  .history-day .day-lbl{ font-size:10px; color:var(--text-soft); margin-top:5px; font-weight:600; }

  .ai-messages{ display:flex; flex-direction:column; gap:11px; margin-bottom:16px; min-height:40vh; }
  .ai-bubble{ max-width:82%; padding:12px 16px; border-radius:16px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .ai-bubble.mine{ align-self:flex-end; background:linear-gradient(135deg, var(--green), var(--green-dim)); color:#04140D; border-bottom-right-radius:4px; font-weight:600; }
  .ai-bubble.theirs{ align-self:flex-start; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .ai-bubble.thinking{ color:var(--text-soft); font-style:italic; }
  .ai-input-row{ display:flex; gap:8px; }
  .ai-input-row input{ flex:1; margin-bottom:0; }
  .ai-suggestions{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .ai-chip{ font-size:12px; background:var(--panel); border:1px solid var(--border-strong); color:var(--text-soft); padding:8px 14px; border-radius:18px; cursor:pointer; font-weight:500; }
  .ai-chip:hover{ border-color:var(--green); color:var(--green); }

  .trade-card{ background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:9px; cursor:pointer; transition:all 0.15s ease; }
  .trade-card:hover{ border-color:var(--border-strong); }
  .trade-card-top{ display:flex; align-items:center; gap:10px; }
  .direction-badge{ font-size:10px; font-weight:800; padding:4px 9px; border-radius:6px; text-transform:uppercase; letter-spacing:0.4px; }
  .direction-badge.buy{ background:rgba(23,230,161,0.15); color:var(--green); }
  .direction-badge.sell{ background:rgba(255,77,106,0.15); color:var(--red); }
  .trade-pair{ font-weight:800; font-size:14px; }
  .trade-date{ font-size:11px; color:var(--text-soft); font-family:var(--font-mono); }
  .trade-pnl{ margin-left:auto; font-family:var(--font-mono); font-weight:800; font-size:15px; }
  .trade-detail{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-soft); }
  .trade-detail.open{ display:block; }
  .trade-detail-row{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .trade-detail img{ max-width:100%; border-radius:8px; margin-top:8px; }
  .trade-actions{ display:flex; gap:8px; margin-top:10px; }
  .trade-actions button{ flex:1; padding:8px; font-size:12px; }

  @media (max-width: 600px){
    :root{ --rail-w:60px; }
    .rail-item{ width:44px; height:44px; }
    .rail-item svg{ width:18px; height:18px; }
    .rail-item .rail-lbl{ display:none; }
    .wrap{ padding:24px 16px 50px calc(var(--rail-w) + 16px); }
  }
</style>
</head>
<body>

<div id="accessGate">
  <div class="gate-box">
    <div class="gate-emoji">⚡</div>
    <div class="gate-title">SLF TRADER HUB</div>
    <div class="gate-sub">Private community for funded traders</div>
    <div class="gate-tabs">
      <div class="gate-tab active" id="tabLogin">Login</div>
      <div class="gate-tab" id="tabSignup">Sign Up</div>
    </div>
    <div id="signupOnlyField">
      <input type="text" id="gateCode" placeholder="ACCESS CODE" maxlength="20">
    </div>
    <input type="text" id="gateUsername" placeholder="Username" maxlength="20">
    <input type="password" id="gatePassword" placeholder="Password" maxlength="30">
    <button class="primary" id="gateBtn" style="width:100%;">Login</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="wrap gated" id="app"></div>

<div class="modal-overlay hidden" id="imgModal"><img id="imgModalPic" src=""></div>
<div class="modal-overlay hidden" id="listModal">
  <div class="list-modal-box">
    <div class="list-modal-head"><h3 id="listModalTitle">Followers</h3><span class="list-modal-close" id="listModalClose">✕</span></div>
    <div id="listModalBody"></div>
  </div>
</div>

<div class="nav-rail gated" id="bottomNav">
  <div class="rail-logo">⚡</div>
  <div class="rail-item active" data-nav="home">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <span class="rail-lbl">Home</span>
  </div>
  <div class="rail-item" data-nav="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span class="rail-lbl">Traders</span>
  </div>
  <div class="rail-item" data-nav="rms">
    <svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M11 19V4"/><path d="M18 19v-7"/><path d="M2.5 19h19"/></svg>
    <span class="rail-lbl">RMS</span>
  </div>

<script>
/* ================= STATE ================= */
let currentUser = null;
let profile = { username:"", bio:"", photoBase64:null, following:[], followers:[], accountSize:null, accountType:"", startDate:"", goalItems:[], ruleItems:[], habitItems:[], runningEquity:null, totalPnl:0 };
let allTradersCache = null;

const ACCOUNT_TYPES = ["1 Step Challenge", "2 Step Challenge", "Instant Funding"];

const DEFAULT_GOALS = [
  "Journal every trade taken today",
  "Stick to my max risk per trade",
  "No revenge trading after a loss",
  "Check economic calendar before trading",
  "Screenshot every entry & exit"
];
const DEFAULT_RULES = [
  "Set stop-loss within 5 minutes of entry",
  "Didn't exceed max daily loss",
  "No EA / bot used",
  "Lot size within consistency range",
  "No trading below equity floor"
];
const DEFAULT_HABITS = [
  "Slept 7+ hours last night",
  "Reviewed yesterday's trades",
  "No trading while emotionally stressed",
  "Did a quick breathing/meditation before session",
  "Exercised or moved my body today"
];
function genId(){ return Math.random().toString(36).slice(2,10); }
function withIds(list){ return list.map(text => ({ id: genId(), text })); }

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAPEgEmcs7_upeLU6vvaDmegRaQ0JqX9IE",
  authDomain: "slf-trader-hub.firebaseapp.com",
  projectId: "slf-trader-hub",
  storageBucket: "slf-trader-hub.firebasestorage.app",
  messagingSenderId: "77368939885",
  appId: "1:77368939885:web:4378e56d208bbc1fd67664"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ================= DATA HELPERS ================= */
async function loadProfile(){
  if(!currentUser) return;
  try{
    const snap = await db.collection("traders").doc(currentUser.uid).get();
    if(snap.exists){
      const d = snap.data();
      profile = {
        username: d.username||"", bio: d.bio||"", photoBase64: d.photoBase64||null,
        following: d.following||[], followers: d.followers||[],
        accountSize: d.accountSize||null, accountType: d.accountType||"", startDate: d.startDate||"",
        goalItems: d.goalItems||[], ruleItems: d.ruleItems||[], habitItems: d.habitItems||[],
        runningEquity: (d.runningEquity !== undefined) ? d.runningEquity : null, totalPnl: d.totalPnl||0
      };
    }
  }catch(e){}
}
async function saveProfileFields(fields){
  if(!currentUser) return;
  Object.assign(profile, fields);
  try{ await db.collection("traders").doc(currentUser.uid).update(fields); }catch(e){}
}
async function toggleFollow(targetUid, isFollowing){
  const batch = db.batch();
  const meRef = db.collection("traders").doc(currentUser.uid);
  const themRef = db.collection("traders").doc(targetUid);
  if(isFollowing){
    batch.update(meRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
    batch.update(themRef, { followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
    profile.following = profile.following.filter(u => u !== targetUid);
  } else {
    batch.update(meRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
    batch.update(themRef, { followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
    profile.following.push(targetUid);
  }
  await batch.commit();
}
async function getTraderByUid(uid){
  if(allTradersCache){ const f = allTradersCache.find(u => u.uid === uid); if(f) return f; }
  try{ const snap = await db.collection("traders").doc(uid).get(); if(snap.exists) return { uid, ...snap.data() }; }catch(e){}
  return null;
}

/* ---------- TRADE JOURNAL ---------- */
async function equityDelta(delta){
  const newEquity = (profile.runningEquity ?? profile.accountSize ?? 0) + delta;
  const newTotalPnl = (profile.totalPnl || 0) + delta;
  try{ await db.collection("traders").doc(currentUser.uid).update({ runningEquity: newEquity, totalPnl: newTotalPnl }); }catch(e){}
  profile.runningEquity = newEquity;
  profile.totalPnl = newTotalPnl;
}
async function getTodayTrades(){
  try{
    const snap = await db.collection("trades").where("uid","==",currentUser.uid).where("date","==",todayDateStr()).get();
    const list = [];
    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
    return list;
  }catch(e){ return []; }
}
async function getAllTrades(uid){
  try{
    const snap = await db.collection("trades").where("uid","==",uid).orderBy("createdAt","desc").limit(200).get();
    const list = [];
    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
    return list;
  }catch(e){ return []; }
}
async function addTrade(trade){
  await db.collection("trades").add({ ...trade, uid: currentUser.uid, createdAt: Date.now() });
  await equityDelta(trade.pnl);
}
async function updateTrade(tradeId, oldPnl, newTrade){
  await db.collection("trades").doc(tradeId).update(newTrade);
  await equityDelta(newTrade.pnl - oldPnl);
}
async function deleteTrade(tradeId, pnl){
  await db.collection("trades").doc(tradeId).delete();
  await equityDelta(-pnl);
}
function computeTradeStats(trades){
  const total = trades.length;
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const winRate = total ? (wins.length/total*100) : 0;
  const sumWins = wins.reduce((s,t)=>s+t.pnl,0);
  const sumLosses = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const profitFactor = sumLosses > 0 ? (sumWins/sumLosses) : (sumWins > 0 ? Infinity : 0);
  const avgWin = wins.length ? sumWins/wins.length : 0;
  const avgLoss = losses.length ? sumLosses/losses.length : 0;
  const rrVals = trades.filter(t => typeof t.rr === "number").map(t => t.rr);
  const avgR = rrVals.length ? rrVals.reduce((s,v)=>s+v,0)/rrVals.length : null;
  return { total, winRate, profitFactor, avgWin, avgLoss, avgR, sumWins, sumLosses };
}

/* ================= ROUTER ================= */
const app = document.getElementById("app");
function nav(view, payload){
  updateBottomNavActive(view);
  if(view==="home") renderHome();
  else if(view==="search") renderSearch();
  else if(view==="profile") renderProfile();
  else if(view==="publicProfile") renderPublicProfile(payload);
  else if(view==="rms") renderRMS();
  else if(view==="leaderboard") renderLeaderboard();
  else if(view==="journal") renderJournal();
  else if(view==="addTrade") renderAddTrade(payload);
  else if(view==="trackerHub") renderTrackerHub();
  else if(view==="goals") renderTrackerPage("goals","goalItems","🎯","Daily Goals");
  else if(view==="rules") renderTrackerPage("rules","ruleItems","📜","Rules Followed");
  else if(view==="habits") renderTrackerPage("habits","habitItems","🔁","Habits");
  else if(view==="ai") renderAI();
}
function updateBottomNavActive(view){
  const trackerViews = ["trackerHub","goals","rules","habits"];
  const journalViews = ["journal","addTrade"];
  document.querySelectorAll(".rail-item").forEach(el => {
    const isActive = el.dataset.nav === view
      || (el.dataset.nav === "trackerHub" && trackerViews.includes(view))
      || (el.dataset.nav === "journal" && journalViews.includes(view));
    el.classList.toggle("active", isActive);
  });
}
document.querySelectorAll(".rail-item").forEach(el => el.addEventListener("click", () => nav(el.dataset.nav)));

/* ================= HOME ================= */
async function renderHome(){
  const equity = profile.runningEquity !== null ? profile.runningEquity : profile.accountSize;
  const pctGain = (profile.accountSize && equity !== null) ? ((equity - profile.accountSize)/profile.accountSize*100) : null;
  const todayTrades = profile.accountSize ? await getTodayTrades() : [];
  const todayTotal = todayTrades.reduce((s,t) => s + t.pnl, 0);

  app.innerHTML = `
    <div class="home-header">
      <h1>⚡ SLF TRADER HUB</h1>
      <div class="sub">Welcome back, ${profile.username}</div>
    </div>
    <div class="section-block">
      <h4>Your Account</h4>
      <div class="trade-stats">
        <div class="stat-card"><div class="lbl">Account Size</div><div class="val">${profile.accountSize ? "$"+profile.accountSize.toLocaleString() : "—"}</div></div>
        <div class="stat-card"><div class="lbl">Current Equity</div><div class="val" style="${pctGain!==null && pctGain<0 ? 'color:var(--red);' : ''}">${equity!==null ? "$"+Math.round(equity).toLocaleString() : "—"}</div></div>
        <div class="stat-card"><div class="lbl">Total Gain</div><div class="val" style="${pctGain!==null && pctGain<0 ? 'color:var(--red);' : ''}">${pctGain!==null ? (pctGain>=0?"+":"")+pctGain.toFixed(2)+"%" : "—"}</div></div>
      </div>
      ${(!profile.accountSize || !profile.accountType) ? `<p style="font-size:12px; color:var(--text-soft); margin-top:8px;">Apni profile me account details set karo taaki doston ko dikh sake.</p>` : ""}
    </div>

    ${profile.accountSize ? `
    <div class="section-block">
      <h4>📓 Today's Trades</h4>
      <div class="trade-stats" style="margin-bottom:14px;">
        <div class="stat-card"><div class="lbl">Trades Today</div><div class="val" style="color:var(--text);">${todayTrades.length}</div></div>
        <div class="stat-card"><div class="lbl">Today's P&L</div><div class="val" style="color:${todayTotal>=0?'var(--green)':'var(--red)'};">${todayTotal>=0?'+':''}$${Math.round(todayTotal).toLocaleString()}</div></div>
      </div>
      <button class="primary" id="addTradeBtn" style="width:100%;">+ Log a Trade</button>
    </div>
    ` : ""}

    <div class="index-head" style="font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">People You Follow</div>
    <div id="followingList"><p style="color:var(--text-soft); font-size:13px;">Loading…</p></div>
  `;
  const addBtn = document.getElementById("addTradeBtn");
  if(addBtn) addBtn.addEventListener("click", () => nav("addTrade"));
  const listEl = document.getElementById("followingList");
  if(!profile.following || profile.following.length === 0){
    listEl.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Abhi kisi ko follow nahi kiya. 🔍 Traders tab se apne doston ko dhoondo.</p>`;
    return;
  }
  const traders = await Promise.all(profile.following.map(uid => getTraderByUid(uid)));
  listEl.innerHTML = "";
  traders.filter(Boolean).forEach(t => {
    const tEquity = t.runningEquity !== null && t.runningEquity !== undefined ? t.runningEquity : t.accountSize;
    const tGain = (t.accountSize && tEquity !== null && tEquity !== undefined) ? ((tEquity - t.accountSize)/t.accountSize*100) : null;
    const row = document.createElement("div");
    row.className = "trader-row";
    row.innerHTML = `
      <div class="dp-small">${t.photoBase64 ? `<img src="${t.photoBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : "👤"}</div>
      <div style="flex:1;">
        <div class="tname">${t.username}</div>
        <div class="tmeta">${t.accountType || "—"} ${t.accountSize ? "· $"+t.accountSize.toLocaleString() : ""}</div>
      </div>
      ${tGain!==null ? `<div style="font-family:var(--font-mono); font-weight:800; color:${tGain>=0?'var(--green)':'var(--red)'};">${tGain>=0?"+":""}${tGain.toFixed(1)}%</div>` : ""}
    `;
    row.addEventListener("click", () => nav("publicProfile", t.uid));
    listEl.appendChild(row);
  });
}

/* ================= LEADERBOARD ================= */
async function renderLeaderboard(){
  app.innerHTML = `<h2 style="margin-bottom:14px;">🏆 Leaderboard</h2><p style="color:var(--text-soft); font-size:13px;">Loading…</p>`;
  let snap;
  try{ snap = await db.collection("traders").get(); }catch(e){}
  const traders = [];
  if(snap) snap.forEach(doc => traders.push({ uid: doc.id, ...doc.data() }));

  const ranked = traders
    .filter(t => t.accountSize)
    .map(t => {
      const equity = (t.runningEquity !== null && t.runningEquity !== undefined) ? t.runningEquity : t.accountSize;
      const pct = (equity - t.accountSize) / t.accountSize * 100;
      return { ...t, equity, pct };
    })
    .sort((a,b) => b.pct - a.pct);

  app.innerHTML = `
    <h2 style="margin-bottom:6px;">🏆 Leaderboard</h2>
    <p style="font-size:12px; color:var(--text-soft); margin-bottom:18px;">Ranked by % gain on account — sabse fair comparison chahe account size alag ho.</p>
    <div id="lbList"></div>
  `;
  const listEl = document.getElementById("lbList");
  if(ranked.length === 0){
    listEl.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Abhi koi trader ne account size set nahi kiya.</p>`;
    return;
  }
  ranked.forEach((t, i) => {
    const rank = i+1;

}

/* ================= TRADE JOURNAL ================= */
async function renderJournal(){
  app.innerHTML = `<h2 style="margin-bottom:14px;">📓 Trade Journal</h2><p style="color:var(--text-soft); font-size:13px;">Loading…</p>`;
  const trades = await getAllTrades(currentUser.uid);
  const stats = computeTradeStats(trades);

  app.innerHTML = `
    <h2 style="margin-bottom:6px;">📓 Trade Journal</h2>
    <p style="font-size:12px; color:var(--text-soft); margin-bottom:18px;">Har trade alag se log karo — real stats yahan se nikalte hain.</p>

    <div class="section-block">
      <h4>Stats</h4>
      <div class="trade-stats">
        <div class="stat-card"><div class="lbl">Total Trades</div><div class="val" style="color:var(--text);">${stats.total}</div></div>
        <div class="stat-card"><div class="lbl">Win Rate</div><div class="val">${stats.winRate.toFixed(1)}%</div></div>
        <div class="stat-card"><div class="lbl">Profit Factor</div><div class="val">${stats.profitFactor===Infinity ? "∞" : stats.profitFactor.toFixed(2)}</div></div>
        <div class="stat-card"><div class="lbl">Avg Win</div><div class="val" style="color:var(--green);">$${Math.round(stats.avgWin).toLocaleString()}</div></div>
        <div class="stat-card"><div class="lbl">Avg Loss</div><div class="val" style="color:var(--red);">$${Math.round(stats.avgLoss).toLocaleString()}</div></div>
        <div class="stat-card"><div class="lbl">Avg R:R</div><div class="val">${stats.avgR!==null ? stats.avgR.toFixed(2)+"R" : "—"}</div></div>
      </div>
    </div>

    <button class="primary" id="addTradeBtn2" style="width:100%; margin-bottom:18px;">+ Log a Trade</button>

    <div class="index-head" style="font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">History</div>
    <div id="tradesList"></div>
  `;
  document.getElementById("addTradeBtn2").addEventListener("click", () => nav("addTrade"));

  const listEl = document.getElementById("tradesList");
  if(trades.length === 0){
    listEl.innerHTML = `<p style="color:var(--text-soft); font-size:13px;">Abhi koi trade log nahi hui.</p>`;
    return;
  }
  trades.forEach(t => {
    const card = document.createElement("div");
    card.className = "trade-card";
    card.innerHTML = `
      <div class="trade-card-top">
        <span class="direction-badge ${t.direction==='Buy'?'buy':'sell'}">${t.direction}</span>
        <span class="trade-pair">${t.pair}</span>
        <span class="trade-date">${t.date}</span>
        <span class="trade-pnl" style="color:${t.pnl>=0?'var(--green)':'var(--red)'};">${t.pnl>=0?'+':''}$${Math.round(t.pnl).toLocaleString()}</span>
      </div>
      <div class="trade-detail" id="detail-${t.id}">
        ${t.entryPrice ? `<div class="trade-detail-row"><span>Entry</span><span>${t.entryPrice}</span></div>` : ""}
        ${t.exitPrice ? `<div class="trade-detail-row"><span>Exit</span><span>${t.exitPrice}</span></div>` : ""}
        ${t.lotSize ? `<div class="trade-detail-row"><span>Lot Size</span><span>${t.lotSize}</span></div>` : ""}
        ${(typeof t.rr === "number") ? `<div class="trade-detail-row"><span>R:R</span><span>${t.rr}R</span></div>` : ""}
        ${t.note ? `<p style="margin-top:8px;">${t.note}</p>` : ""}
        ${t.screenshot ? `<img src="${t.screenshot}">` : ""}
        <div class="trade-actions">
          <button class="ghost" data-edit="${t.id}">Edit</button>
          <button class="ghost" data-del="${t.id}" style="color:var(--red);">Delete</button>
        </div>
      </div>
    `;
    card.querySelector(".trade-card-top").addEventListener("click", () => {
      document.getElementById(`detail-${t.id}`).classList.toggle("open");
    });
    listEl.appendChild(card);
  });
  listEl.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const trade = trades.find(x => x.id === btn.dataset.edit);
      nav("addTrade", trade);
    });
  });
  listEl.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if(!confirm("Ye trade delete karni hai?")) return;
      const trade = trades.find(x => x.id === btn.dataset.del);
      await deleteTrade(trade.id, trade.pnl);
      renderJournal();
    });
  });
}

function renderAddTrade(editTrade){
  const isEdit = !!editTrade;
  app.innerHTML = `
    <div class="backbtn" id="backBtn">← Journal</div>
    <h2 style="margin-bottom:16px;">${isEdit ? "✏️ Edit Trade" : "+ Log a Trade"}</h2>

        <option value="Sell" ${isEdit && editTrade.direction==='Sell' ? 'selected':''}>Sell</option>
      </select>
      <label>Date</label>
      <input type="date" id="tDate" value="${isEdit ? editTrade.date : todayDateStr()}">
      <label>Entry Price (optional)</label>
      <input type="text" id="tEntry" value="${isEdit && editTrade.entryPrice ? editTrade.entryPrice : ''}" placeholder="e.g. 2015.50">

      <input type="text" id="tExit" value="${isEdit && editTrade.exitPrice ? editTrade.exitPrice : ''}" placeholder="e.g. 2020.30">

      <input type="text" id="tLot" value="${isEdit && editTrade.lotSize ? editTrade.lotSize : ''}" placeholder="e.g. 0.5">
      <label>P&L ($) — required, negative if loss</label>
      <input type="number" id="tPnl" value="${isEdit ? editTrade.pnl : ''}" placeholder="e.g. 480 or -220">
      <label>R:R (optional)</label>
      <input type="number" step="0.1" id="tRR" value="${isEdit && typeof editTrade.rr==='number' ? editTrade.rr : ''}" placeholder="e.g. 2.5">
      <label>Note (optional)</label>
      <textarea class="bio-box" id="tNote" placeholder="Setup, reasoning, mistakes...">${isEdit && editTrade.note ? editTrade.note : ''}</textarea>
      <label>Screenshot (optional)</label>
      <input type="file" id="tScreenshot" accept="image/*">
      <div id="tScreenshotPreview" style="margin-top:8px;">${isEdit && editTrade.screenshot ? `<img src="${editTrade.screenshot}" style="max-width:100%; border-radius:8px;">` : ""}</div>
      <button class="primary" id="saveTradeBtn" style="width:100%; margin-top:14px;">${isEdit ? "Save Changes" : "Log Trade"}</button>
      <div class="gate-error" id="tradeError"></div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", () => nav("journal"));

  let screenshotBase64 = isEdit ? (editTrade.screenshot || null) : null;
  document.getElementById("tScreenshot").addEventListener("change", (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxDim = 700;
        const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        screenshotBase64 = canvas.toDataURL("image/jpeg", 0.7);
        document.getElementById("tScreenshotPreview").innerHTML = `<img src="${screenshotBase64}" style="max-width:100%; border-radius:8px;">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("saveTradeBtn").addEventListener("click", async () => {
    const pnl = parseFloat(document.getElementById("tPnl").value);
    const pair = document.getElementById("tPair").value.trim();
    const errEl = document.getElementById("tradeError");
    if(!pair){ errEl.textContent = "Pair/symbol daalo."; return; }

    const rrVal = document.getElementById("tRR").value;
    const tradeData = {
      pair, direction: document.getElementById("tDirection").value,
      date: document.getElementById("tDate").value || todayDateStr(),
      entryPrice: document.getElementById("tEntry").value.trim(),
      exitPrice: document.getElementById("tExit").value.trim(),
      lotSize: document.getElementById("tLot").value.trim(),
      pnl, rr: rrVal !== "" ? parseFloat(rrVal) : null,
      note: document.getElementById("tNote").value.trim(),
      screenshot: screenshotBase64
    };
    document.getElementById("saveTradeBtn").disabled = true;
    if(isEdit){
      await updateTrade(editTrade.id, editTrade.pnl, tradeData);
    } else {
      await addTrade(tradeData);
    }
    nav("journal");
  });
}

/* ================= RMS CALCULATOR + RULES ================= */
const SLF_RULES_1STEP = {
  maxDailyLossPct: 4,
  maxOverallDDPct: 8,
  profitTargetPct: 8
};

const RULES_LIST = [
  "<b>Max Daily Loss:</b> 4% of initial balance — recalculated every day at 5pm EST using the higher of your balance or equity.",
  "<b>Max Overall Drawdown:</b> 8% of initial balance — this is STATIC, meaning it does NOT trail up with your profits.",
  "<b>Profit Target:</b> 8% of initial balance to pass the 1-Step Challenge.",
  "<b>Stop-Loss:</b> Mandatory within 5 minutes of opening a trade (funded phase). Recommended during challenge.",
  "<b>EAs / Bots:</b> Not permitted on the 1-Step Challenge.",
  "<b>News Trading:</b> Allowed at all times.",
  "<b>Lot Size Consistency:</b> Max lot size ≤ your average +100% · Min lot size ≥ your average −75%.",
  "<b>Profit Consistency:</b> No single trading day's profit should exceed 25% of your total profit.",
  "<b>Copy Trading:</b> Only allowed for copying your own trades — copying other traders is not allowed.",
  "<b>Trading Days:</b> No fixed minimum required to pass, per SLF's published 1-Step Challenge FAQ — always verify on your dashboard."
];

let rmsTab = "calc";
function renderRMS(){
  app.innerHTML = `
    <h2 style="margin-bottom:14px;">📊 RMS — 1 Step Challenge</h2>
    <div class="rms-tabs">
      <div class="rms-tab ${rmsTab==='calc'?'active':''}" id="rmsTabCalc">Calculator</div>
      <div class="rms-tab ${rmsTab==='rules'?'active':''}" id="rmsTabRules">Rules</div>
    </div>
    <div id="rmsContent"></div>
  `;
  document.getElementById("rmsTabCalc").addEventListener("click", () => { rmsTab="calc"; renderRMS(); });
  document.getElementById("rmsTabRules").addEventListener("click", () => { rmsTab="rules"; renderRMS(); });

function renderRMSCalculator(){
  const content = document.getElementById("rmsContent");
  const defaultBalance = profile.accountSize || 100000;
  content.innerHTML = `
    <div class="section-block">
      <label>Account Balance ($)</label>

    </div>
    <div id="rmsResults"></div>
    <div class="rms-disclaimer">⚠️ This is a formula-based calculator using SLF's publicly documented 1-Step Challenge rules — not financial advice. Rule numbers can change; always confirm current limits on your SLF dashboard before trading.</div>
  `;
  document.getElementById("rmsCalcBtn").addEventListener("click", computeRMS);
  computeRMS();

function computeRMS(){
  const balance = parseFloat(document.getElementById("rmsBalance").value) || 0;
  const todayPL = parseFloat(document.getElementById("rmsTodayPL").value) || 0;
  const riskPct = parseFloat(document.getElementById("rmsRiskPct").value) || 1;

  const maxDailyLoss = balance * (SLF_RULES_1STEP.maxDailyLossPct/100);
  const maxOverallDD = balance * (SLF_RULES_1STEP.maxOverallDDPct/100);
  const profitTarget = balance * (SLF_RULES_1STEP.profitTargetPct/100);
  const lossUsedToday = todayPL < 0 ? Math.abs(todayPL) : 0;
  const dailyLossRemaining = maxDailyLoss - lossUsedToday;
  const suggestedRiskPerTrade = balance * (riskPct/100);
  const floorEquity = balance - maxOverallDD;

  const resultsEl = document.getElementById("rmsResults");
  const breached = dailyLossRemaining <= 0;
  resultsEl.innerHTML = `
    <div class="rms-output">
      <div class="out-card"><div class="lbl">Max Daily Loss</div><div class="val">$${maxDailyLoss.toLocaleString()}</div><div class="sub">4% of balance</div></div>
      <div class="out-card ${dailyLossRemaining < maxDailyLoss*0.25 ? 'warn':''}"><div class="lbl">Daily Loss Remaining Today</div><div class="val">$${Math.max(0,dailyLossRemaining).toLocaleString()}</div><div class="sub">Used so far: $${lossUsedToday.toLocaleString()}</div></div>
      <div class="out-card"><div class="lbl">Max Overall Drawdown</div><div class="val">$${maxOverallDD.toLocaleString()}</div><div class="sub">Static — equity floor: $${floorEquity.toLocaleString()}</div></div>
      <div class="out-card"><div class="lbl">Profit Target to Pass</div><div class="val">$${profitTarget.toLocaleString()}</div><div class="sub">8% of balance</div></div>
      <div class="out-card"><div class="lbl">Suggested Max Risk / Trade</div><div class="val">$${suggestedRiskPerTrade.toLocaleString()}</div><div class="sub">${riskPct}% of balance</div></div>
      <div class="out-card"><div class="lbl">Trades Left Today (approx)</div><div class="val">${suggestedRiskPerTrade>0 ? Math.floor(Math.max(0,dailyLossRemaining)/suggestedRiskPerTrade) : "—"}</div><div class="sub">at this risk-per-trade size</div></div>
    </div>
    ${breached ? `<div class="breach-banner">🚨 Daily loss limit hit or exceeded — SLF rules likely consider this account breached for today. Stop trading.</div>` : ""}
  `;
}

function renderRMSRulesTab(){
  const content = document.getElementById("rmsContent");
  content.innerHTML = `
    <ul class="rules-list">${RULES_LIST.map(r => `<li>${r}</li>`).join("")}</ul>
    <div class="rms-disclaimer">Source: SLF's publicly documented 1-Step Challenge rules. SLF's own rule pages have occasionally shown minor inconsistencies (per independent reviews) — treat this as a quick reference, not the final word. Always check your live SLF dashboard.</div>
  `;
}

/* ================= AI ASSISTANT (rule-based, free, no API) ================= */
function fmtMoney(n){ return "$" + Math.round(n).toLocaleString(); }

function extractNumber(text){
  const m = text.replace(/,/g,"").match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}

const BOT_TOPICS = [
  {
    key: "dailyloss",
    keywords: ["daily loss","daily limit","loss today","lost today","aur trade","more trade","can i trade","trade karu"],
    reply: (text) => {
      const balance = profile.accountSize || 100000;
      const maxDailyLoss = balance * 0.04;
      const lossAmt = extractNumber(text);
      let out = `📉 Max Daily Loss on your $${balance.toLocaleString()} account is ${fmtMoney(maxDailyLoss)} (4%).`;
      if(lossAmt !== null){
        const remaining = maxDailyLoss - lossAmt;
        if(remaining <= 0){
          out += `\n\n🚨 Tumne ${fmtMoney(lossAmt)} loss bataya — ye daily limit se zyada/barabar hai. Aaj ke liye trading ROK DO, warna breach ho sakta hai.`;
        } else {
          out += `\n\nTumne ${fmtMoney(lossAmt)} loss bataya, to aaj ke liye ${fmtMoney(remaining)} ka buffer bacha hai. Chhote size me hi trade karo, buffer khatam hone se pehle ruk jao.`;
        }
      } else {
        out += `\n\nApna aaj ka loss amount bata do (jaise "aaj $1500 loss hua") to main exact buffer nikal ke bata dunga.`;
      }
      return out;
    }
  },
  {
    key: "drawdown",
    keywords: ["drawdown","overall loss","account blown","blown","max loss","dd "],
    reply: () => {
      const balance = profile.accountSize || 100000;
      const maxDD = balance * 0.08;
      const floor = balance - maxDD;
      return `📊 Max Overall Drawdown is ${fmtMoney(maxDD)} (8% of your $${balance.toLocaleString()} account) — this is STATIC, it does NOT move up with your profits.\n\nYour equity should never fall below ${fmtMoney(floor)}, no matter how much profit you've made.`;
    }
  },
  {
    key: "profittarget",
    keywords: ["profit target","pass challenge","how much profit","target hit","target kitna"],
    reply: () => {
      const balance = profile.accountSize || 100000;
      const target = balance * 0.08;
      return `🎯 Profit Target to pass the 1-Step Challenge is ${fmtMoney(target)} (8% of your $${balance.toLocaleString()} account). No fixed minimum trading days required per SLF's published FAQ — but double-check your dashboard, as this can vary.`;
    }
  },
  {
    key: "stoploss",
    keywords: ["stop loss","stoploss","sl ", " sl"],
    reply: () => `🛑 Stop-loss is mandatory within 5 minutes of opening a trade during the FUNDED phase (recommended but not mandatory during the challenge). Fake stop-losses set way beyond your drawdown limit are not allowed.`
  },
  {
    key: "ea",
    keywords: ["ea","bot","expert advisor","algo","automated"],
    reply: () => `🤖 EAs / Expert Advisors / bots are NOT permitted on the 1-Step Challenge. Stick to manual or semi-manual trading.`
  },
  {
    key: "news",
    keywords: ["news trad","nfp","fomc","news event"],
    reply: () => `📰 News trading is allowed at all times on SLF's 1-Step Challenge — no restriction during high-impact news.`
  },
  {
    key: "lotsize",
    keywords: ["lot size","lot consistency","max lot","min lot"],
    reply: () => `📐 Lot Size Consistency rule: your max lot size can't exceed your average +100%, and your min lot size can't be below your average -75%. Trades opened close together in the same pair/direction count as one "Trade Idea".`
  },
  {
    key: "consistency",
    keywords: ["consistency","single day profit","25%"],
    reply: () => `⚖️ Profit Consistency rule: no single trading day's profit should be ≥25% of your total profit for the payout period. Spread your gains across multiple days.`
  },
  {
    key: "copytrading",
    keywords: ["copy trad","copier","mirror trade"],
    reply: () => `📋 Copy trading is only allowed for copying YOUR OWN trades to your SLF account — copying signals/trades from other traders is not allowed.`
  },
  {
    key: "payout",
    keywords: ["payout","withdraw","profit split"],
    reply: () => `💰 SLF offers instant payout requests with a 24-hour processing guarantee (extra 10% profit split bonus if delayed beyond that). Standard profit split starts around 80% and can scale higher — check your dashboard for your current split.`
  },
  {
    key: "breach",
    keywords: ["breach","failed","account closed","terminated","account band"],
    reply: () => `⚠️ If you breach the max daily loss or max overall drawdown, SLF typically closes/fails that account immediately. There's usually no way to "undo" a breach — the safest move is to always stop trading before hitting your daily loss buffer. Check your SLF dashboard for their exact breach/appeal policy.`
  }
];

function generateBotReply(userText){
  const lower = userText.toLowerCase();
  for(const topic of BOT_TOPICS){
    if(topic.keywords.some(k => lower.includes(k))){
      return topic.reply(userText);
    }
  }
  return `Mujhe pura yakeen nahi is sawal ka — but main in topics me help kar sakta hoon: daily loss limit, max drawdown, profit target, stop-loss rule, EA rules, news trading, lot size consistency, profit consistency, copy trading, payouts, ya breach hone par kya hota hai. Inme se koi ek try karo, ya SLF support se confirm kar lo.`;
}

    aiChatHistory.push({ role:"assistant", content: reply });
    renderAIMessages();
  }, 400);
}

/* ================= DAILY TRACKER ================= */
function todayDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateStrDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function genId(){ return Math.random().toString(36).slice(2,10); }

let todayLog = { goals:{}, rules:{}, habits:{} };

async function loadTodayLog(){
  const docId = `${currentUser.uid}_${todayDateStr()}`;
  try{
    const snap = await db.collection("dailyLogs").doc(docId).get();
    if(snap.exists){
      const d = snap.data();
      todayLog = { goals: d.goals||{}, rules: d.rules||{}, habits: d.habits||{} };
    } else {
      todayLog = { goals:{}, rules:{}, habits:{} };
    }
  }catch(e){ todayLog = { goals:{}, rules:{}, habits:{} }; }
}
async function toggleLogItem(category, itemId, checked){
  todayLog[category][itemId] = checked;
  const docId = `${currentUser.uid}_${todayDateStr()}`;
  try{
    await db.collection("dailyLogs").doc(docId).set({
      uid: currentUser.uid, date: todayDateStr(),
      [category]: todayLog[category]
    }, { merge: true });
  }catch(e){}
}
async function addTrackerItemSilent(category, arrayKey){
  const inputId = `newItem-${category}`;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if(!text) return;
  profile[arrayKey].push({ id: genId(), text });
  try{ await db.collection("traders").doc(currentUser.uid).update({ [arrayKey]: profile[arrayKey] }); }catch(e){}
}
async function deleteTrackerItemSilent(arrayKey, itemId){
  profile[arrayKey] = profile[arrayKey].filter(i => i.id !== itemId);
  try{ await db.collection("traders").doc(currentUser.uid).update({ [arrayKey]: profile[arrayKey] }); }catch(e){}
}

function trackerSectionHtml(title, category, arrayKey){
  const items = profile[arrayKey] || [];
  const doneCount = items.filter(i => todayLog[category][i.id]).length;
  const pct = items.length ? Math.round((doneCount/items.length)*100) : 0;
  return `
    <div class="tracker-section">
      <div class="tracker-head"><h4>${title}</h4><span class="tracker-pct">${doneCount}/${items.length} · ${pct}%</span></div>
      ${items.length === 0 ? `<p style="font-size:12px;color:var(--text-soft);">Koi item nahi hai — neeche add karo.</p>` : ""}
      ${items.map(i => `
        <div class="tracker-item ${todayLog[category][i.id] ? 'done' : ''}">
          <input type="checkbox" data-cat="${category}" data-id="${i.id}" ${todayLog[category][i.id] ? "checked" : ""}>
          <span class="item-text">${i.text}</span>
          <span class="del-x" data-delkey="${arrayKey}" data-delid="${i.id}">✕</span>
        </div>
      `).join("")}
      <div class="add-item-row">
        <input type="text" id="newItem-${category}" placeholder="Naya item add karo...">
        <button class="ghost" data-addcat="${category}" data-addkey="${arrayKey}">+ Add</button>
      </div>
      <button class="ghost" style="margin-top:10px; width:100%;" data-suggestcat="${category}" data-suggestkey="${arrayKey}">✨ Load Suggested Items</button>
    </div>
  `;
}

async function renderTrackerHub(){
  app.innerHTML = `<h2 style="margin-bottom:14px;">✅ Daily Tracker</h2><p style="color:var(--text-soft); font-size:13px;">Loading…</p>`;
  await loadTodayLog();
  const cards = [
    { view:"goals", icon:"🎯", name:"Daily Goals", cat:"goals", key:"goalItems" },
    { view:"rules", icon:"📜", name:"Rules Followed", cat:"rules", key:"ruleItems" },
    { view:"habits", icon:"🔁", name:"Habits", cat:"habits", key:"habitItems" }
  ];
  app.innerHTML = `
    <h2 style="margin-bottom:6px;">✅ Daily Tracker</h2>
    <p style="font-size:12px; color:var(--text-soft); margin-bottom:20px;">Har raat 12 baje naya khaali din shuru hota hai — purana record safe rehta hai.</p>
    <div id="hubCards"></div>
  `;
  const hubEl = document.getElementById("hubCards");
  cards.forEach(c => {
    const items = profile[c.key] || [];
    const done = items.filter(i => todayLog[c.cat][i.id]).length;
    const pct = items.length ? Math.round((done/items.length)*100) : 0;
    const card = document.createElement("div");
    card.className = "tracker-hub-card";
    card.innerHTML = `
      <div class="thc-icon">${c.icon}</div>
      <div style="flex:1;">
        <div class="thc-name">${c.name}</div>
        <div class="thc-pct">${done}/${items.length} today · ${pct}%</div>
      </div>
      <span style="color:var(--text-soft);">›</span>
    `;
    card.addEventListener("click", () => nav(c.view));
    hubEl.appendChild(card);
  });
}

async function renderTrackerPage(category, arrayKey, icon, title){
  app.innerHTML = `<div class="backbtn" id="backBtn">← Daily Tracker</div><h2 style="margin-bottom:14px;">${icon} ${title}</h2><p style="color:var(--text-soft); font-size:13px;">Loading…</p>`;
  await loadTodayLog();

  const historyDates = [6,5,4,3,2,1,0].map(n => dateStrDaysAgo(n));
  let historyData = [];
  try{
    const snap = await db.collection("dailyLogs").where("uid","==",currentUser.uid).where("date","in",historyDates).get();
    const byDate = {};
    snap.forEach(doc => { byDate[doc.data().date] = doc.data(); });
    const totalItems = (profile[arrayKey]||[]).length;
    historyData = historyDates.map(date => {
      const d = byDate[date];
      if(!d || totalItems === 0) return { date, pct: 0 };
      const done = Object.values(d[category]||{}).filter(Boolean).length;
      return { date, pct: Math.round((done/totalItems)*100) };
    });
  }catch(e){
    historyData = historyDates.map(date => ({ date, pct: 0 }));
  }

  app.innerHTML = `
    <div class="backbtn" id="backBtn">← Daily Tracker</div>
    <h2 style="margin-bottom:6px;">${icon} ${title}</h2>
    <p style="font-size:12px; color:var(--text-soft); margin-bottom:16px;">Last 7 days</p>
    <div class="history-strip" id="historyStrip"></div>
    ${trackerSectionHtml(title, category, arrayKey)}
  `;
  document.getElementById("backBtn").addEventListener("click", () => nav("trackerHub"));

  const historyEl = document.getElementById("historyStrip");
  const dayLabels = ["S","M","T","W","T","F","S"];
  historyData.forEach(h => {
    const dayIdx = new Date(h.date + "T00:00:00").getDay();
    const col = document.createElement("div");
    col.className = "history-day";
    col.innerHTML = `<div class="bar"><div class="bar-fill" style="height:${h.pct}%;"></div></div><div class="day-lbl">${dayLabels[dayIdx]}</div>`;
    historyEl.appendChild(col);
  });

  app.querySelectorAll('input[type="checkbox"][data-cat]').forEach(box => {
    box.addEventListener("change", async (e) => {
      await toggleLogItem(e.target.dataset.cat, e.target.dataset.id, e.target.checked);
      renderTrackerPage(category, arrayKey, icon, title);
    });
  });
  app.querySelectorAll(".del-x").forEach(el => {
    el.addEventListener("click", () => deleteTrackerItemOnPage(el.dataset.delkey, el.dataset.delid, category, arrayKey, icon, title));
  });
  app.querySelectorAll("[data-addcat]").forEach(btn => {
    btn.addEventListener("click", () => addTrackerItemOnPage(btn.dataset.addcat, btn.dataset.addkey, category, arrayKey, icon, title));
  });
  const suggestBtn = app.querySelector("[data-suggestcat]");
  if(suggestBtn){
    suggestBtn.addEventListener("click", () => loadSuggestedItems(category, arrayKey, icon, title));
  }
}
const DEFAULTS_MAP = { goals: DEFAULT_GOALS, rules: DEFAULT_RULES, habits: DEFAULT_HABITS };
async function loadSuggestedItems(category, arrayKey, icon, title){
  const existingTexts = (profile[arrayKey]||[]).map(i => i.text.toLowerCase());
  const toAdd = DEFAULTS_MAP[category].filter(t => !existingTexts.includes(t.toLowerCase()));
  if(toAdd.length === 0){ renderTrackerPage(category, arrayKey, icon, title); return; }
  profile[arrayKey] = profile[arrayKey].concat(withIds(toAdd));
  try{ await db.collection("traders").doc(currentUser.uid).update({ [arrayKey]: profile[arrayKey] }); }catch(e){}
  renderTrackerPage(category, arrayKey, icon, title);
}
async function addTrackerItemOnPage(cat, arrayKey, category, ak, icon, title){
  await addTrackerItemSilent(cat, arrayKey);
  renderTrackerPage(category, arrayKey, icon, title);
}
async function deleteTrackerItemOnPage(arrayKey, itemId, category, ak, icon, title){
  await deleteTrackerItemSilent(arrayKey, itemId);
  renderTrackerPage(category, arrayKey, icon, title);
}

/* ================= IMAGE MODAL + LONG PRESS ================= */
function showImageModal(base64){
  if(!base64) return;
  document.getElementById("imgModalPic").src = base64;
  document.getElementById("imgModal").classList.remove("hidden");
}
document.getElementById("imgModal").addEventListener("click", () => document.getElementById("imgModal").classList.add("hidden"));
function attachLongPress(el, cb){
  if(!el) return;
  let timer = null;
  el.addEventListener("pointerdown", () => { timer = setTimeout(cb, 450); });
  el.addEventListener("pointerup", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => clearTimeout(timer));
  el.addEventListener("pointercancel", () => clearTimeout(timer));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

/* ================= AUTH ================= */
let gateMode = "login";
function pseudoEmail(username){ return username.toLowerCase().replace(/[^a-z0-9_]/g,"") + "@slfhub.local"; }
function gateError(msg){ document.getElementById("gateError").textContent = msg; }
function setGateMode(mode){
  gateMode = mode;
  document.getElementById("tabLogin").classList.toggle("active", mode==="login");
  document.getElementById("tabSignup").classList.toggle("active", mode==="signup");
  document.getElementById("signupOnlyField").style.display = mode==="signup" ? "block" : "none";
  document.getElementById("gateBtn").textContent = mode==="signup" ? "Create Account" : "Login";
  gateError("");
}
document.getElementById("tabLogin").addEventListener("click", () => setGateMode("login"));
document.getElementById("tabSignup").addEventListener("click", () => setGateMode("signup"));

async function showAppAfterAuth(user){
  currentUser = user;
  await loadProfile();
  document.getElementById("accessGate").classList.add("hidden");
  document.getElementById("app").classList.remove("gated");
  document.getElementById("bottomNav").classList.remove("gated");
  nav("home");
}

async function handleGateSubmit(){
  const username = document.getElementById("gateUsername").value.trim();
  const password = document.getElementById("gatePassword").value;
  const btn = document.getElementById("gateBtn");
  if(!username || !password){ gateError("Username aur password dono bharo."); return; }
  btn.disabled = true;
  gateError("Please wait…");
  if(gateMode === "signup"){
    const code = document.getElementById("gateCode").value.trim().toUpperCase();
    if(!code){ gateError("Access code bharo."); btn.disabled=false; return; }
    try{
      const codeRef = db.collection("codes").doc(code);
      const codeSnap = await codeRef.get();
      if(!codeSnap.exists){ gateError("❌ Ye access code valid nahi hai."); btn.disabled=false; return; }
      if(codeSnap.data().used === true){ gateError("❌ Ye code already use ho chuka hai."); btn.disabled=false; return; }
      const cred = await auth.createUserWithEmailAndPassword(pseudoEmail(username), password);
      await db.collection("traders").doc(cred.user.uid).set({
        username, bio:"", photoBase64:null,
        following:[], followers:[],
        accountSize:null, accountType:"", startDate:"",
        goalItems: withIds(DEFAULT_GOALS), ruleItems: withIds(DEFAULT_RULES), habitItems: withIds(DEFAULT_HABITS),
        runningEquity: null, totalPnl: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await codeRef.update({ used:true, usedBy: cred.user.uid, usedAt: firebase.firestore.FieldValue.serverTimestamp() });
      await showAppAfterAuth(cred.user);
    }catch(e){
      if(e.code === "auth/email-already-in-use") gateError("❌ Ye username pehle se liya gaya hai.");
      else if(e.code === "auth/weak-password") gateError("❌ Password kam se kam 6 characters ka rakho.");
      else gateError("❌ " + e.message);
      btn.disabled = false;
    }
  } else {
    try{
      const cred = await auth.signInWithEmailAndPassword(pseudoEmail(username), password);
      await showAppAfterAuth(cred.user);
    }catch(e){
      gateError("❌ Galat username ya password.");
      btn.disabled = false;
    }
  }
}
document.getElementById("gateBtn").addEventListener("click", handleGateSubmit);
document.getElementById("gatePassword").addEventListener("keydown", (e) => { if(e.key==="Enter") handleGateSubmit(); });

auth.onAuthStateChanged((user) => {
  if(user){ showAppAfterAuth(user); }
  else{
    currentUser = null;
    document.getElementById("accessGate").classList.remove("hidden");
    document.getElementById("app").classList.add("gated");
    document.getElementById("bottomNav").classList.add("gated");
  }
});
</script>
